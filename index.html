</head>

    <!-- JavaScript 全域邏輯與狀態管理 -->
    <script>
        /**
         * 1. IndexedDB 全域資料庫封裝 (EbookOfflineDB)
         */
        const DB_NAME = 'CloudEbookReaderDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'books';

        function openOfflineDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function saveBookToOfflineDB(id, name, mimeType, arrayBuffer) {
            const db = await openOfflineDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const record = {
                    id: id,
                    name: name,
                    mimeType: mimeType,
                    size: arrayBuffer.byteLength,
                    data: arrayBuffer,
                    cachedAt: Date.now()
                };
                const req = store.put(record);
                req.onsuccess = () => resolve(true);
                req.onerror = (e) => reject(e.target.error);
            });
        }

        async function getBookFromOfflineDB(id) {
            const db = await openOfflineDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.get(id);
                req.onsuccess = (e) => resolve(e.target.result || null);
                req.onerror = (e) => reject(e.target.error);
            });
        }

        async function deleteBookFromOfflineDB(id) {
            const db = await openOfflineDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const req = store.delete(id);
                req.onsuccess = () => resolve(true);
                req.onerror = (e) => reject(e.target.error);
            });
        }

        async function getAllOfflineBookIds() {
            const db = await openOfflineDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.getAllKeys();
                req.onsuccess = (e) => resolve(e.target.result || []);
                req.onerror = (e) => reject(e.target.error);
            });
        }

        async function calculateOfflineStorageUsage() {
            const db = await openOfflineDB();
            return new Promise((resolve) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.getAll();
                req.onsuccess = (e) => {
                    const books = e.target.result || [];
                    const totalBytes = books.reduce((acc, b) => acc + (b.size || 0), 0);
                    resolve((totalBytes / (1024 * 1024)).toFixed(1)); // 回傳 MB
                };
                req.onerror = () => resolve('0.0');
            });
        }

        /**
         * 2. 應用程式全域狀態與 LocalStorage 管理
         */
        const APP_STATE = {
            clientId: localStorage.getItem('gdrive_client_id') || '',
            folderId: localStorage.getItem('gdrive_folder_id') || '',
            autoCache: localStorage.getItem('setting_auto_cache') !== 'false',
            accessToken: null,
            books: JSON.parse(localStorage.getItem('cached_books_list') || '[]'),
            metadata: JSON.parse(localStorage.getItem('bookshelf_metadata') || '{"categories":[],"favorites":[],"progress":{}}'),
            offlineBookIds: new Set(),
            onlyOfflineFilter: false,
            currentBook: null,
            epubBook: null,
            epubRendition: null,
            epubTheme: 'light',
            epubFontSize: 100,
            pdfDoc: null,
            pdfPageNum: 1,
            pdfScale: 1.2
        };

        // 初始化 Service Worker PWA 支援
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    console.log('ServiceWorker 註冊被跳過或未支援 (非 HTTPS 或純本機模式):', err);
                });
            });
        }

        // 初始化網路監聽器
        function updateNetworkStatus() {
            const badge = document.getElementById('networkStatusBadge');
            if (navigator.onLine) {
                badge.className = "hidden sm:inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                badge.innerHTML = `<span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-emerald-400 animate-pulse"></span>已連線`;
            } else {
                badge.className = "hidden sm:inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-500/20 text-amber-300 border border-amber-500/30";
                badge.innerHTML = `<span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-amber-400"></span>離線模式`;
            }
        }
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        // 頁面載入完成後初始化
        window.onload = async () => {
            updateNetworkStatus();
            await refreshOfflineBookIds();
            renderBookshelf();
            updateStats();
        };

        async function refreshOfflineBookIds() {
            const ids = await getAllOfflineBookIds();
            APP_STATE.offlineBookIds = new Set(ids);
        }

        function saveMetadataToLocal() {
            localStorage.setItem('bookshelf_metadata', JSON.stringify(APP_STATE.metadata));
        }

        function saveBooksToLocal() {
            localStorage.setItem('cached_books_list', JSON.stringify(APP_STATE.books));
        }

        /**
         * 3. 書櫃渲染與介面互動
         */
        function renderBookshelf() {
            const grid = document.getElementById('bookshelfGrid');
            const emptyState = document.getElementById('emptyState');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            const categoryVal = document.getElementById('categoryFilter').value;

            grid.innerHTML = '';
            
            let filtered = APP_STATE.books.filter(book => {
                // 搜尋詞過濾
                if (searchQuery && !book.name.toLowerCase().includes(searchQuery)) return false;
                // 離線篩選
                if (APP_STATE.onlyOfflineFilter && !APP_STATE.offlineBookIds.has(book.id)) return false;
                // 分類過濾
                if (categoryVal === 'FAV') return APP_STATE.metadata.favorites.includes(book.id);
                if (categoryVal === 'UNCATEGORIZED') return !getCategoryForBook(book.id);
                if (categoryVal !== 'ALL') return getCategoryForBook(book.id) === categoryVal;
                return true;
            });

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                filtered.forEach(book => {
                    const isFav = APP_STATE.metadata.favorites.includes(book.id);
                    const isOffline = APP_STATE.offlineBookIds.has(book.id);
                    const prog = APP_STATE.metadata.progress[book.id] || { percentage: 0 };
                    const isPdf = book.name.toLowerCase().endsWith('.pdf');

                    const card = document.createElement('div');
                    card.className = "bg-slate-800/90 border border-slate-700/60 rounded-xl overflow-hidden hover:border-slate-500 transition duration-200 flex flex-col justify-between group shadow-lg";
                    
                    card.innerHTML = `
                        <div class="p-4 space-y-3 cursor-pointer flex-1" onclick="openBook('${book.id}')">
                            <div class="flex items-start justify-between gap-2">
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider ${isPdf ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'}">
                                    ${isPdf ? 'PDF' : 'EPUB'}
                                </span>
                                <div class="flex items-center space-x-1">
                                    ${isOffline ? '<span class="text-[10px] bg-cyan-500/20 text-cyan-300 px-1.5 py-0.5 rounded border border-cyan-500/30"><i class="fa-solid fa-hard-drive mr-1"></i>已離線</span>' : ''}
                                    <button onclick="event.stopPropagation(); toggleFavorite('${book.id}')" class="text-slate-500 hover:text-rose-400 p-1 transition">
                                        <i class="fa-${isFav ? 'solid text-rose-500' : 'regular'} fa-heart"></i>
                                    </button>
                                </div>
                            </div>

                            <h4 class="font-semibold text-slate-100 text-sm line-clamp-2 leading-snug group-hover:text-indigo-300 transition" title="${book.name}">
                                ${book.name}
                            </h4>
                        </div>

                        <div class="px-4 py-2.5 bg-slate-900/50 border-t border-slate-700/40 space-y-2">
                            <!-- 閱讀進度條 -->
                            <div class="space-y-1">
                                <div class="flex justify-between text-[11px] text-slate-400">
                                    <span>進度</span>
                                    <span>${Math.round(prog.percentage || 0)}%</span>
                                </div>
                                <div class="w-full bg-slate-700 h-1 rounded-full overflow-hidden">
                                    <div class="bg-indigo-500 h-full" style="width: ${prog.percentage || 0}%"></div>
                                </div>
                            </div>

                            <!-- 離線下載 / 移除按鈕 -->
                            <div class="flex items-center justify-between pt-1">
                                ${isOffline ? `
                                    <button onclick="handleDeleteOfflineBook('${book.id}')" class="text-[11px] text-slate-400 hover:text-rose-400 flex items-center transition" title="刪除本機離線檔案">
                                        <i class="fa-solid fa-trash-can mr-1"></i> 刪除離線
                                    </button>
                                ` : `
                                    <button onclick="handleDownloadOfflineBook('${book.id}')" class="text-[11px] text-cyan-400 hover:text-cyan-300 flex items-center font-medium transition" title="下載至本機離線閱讀">
                                        <i class="fa-solid fa-cloud-arrow-down mr-1"></i> 下載離線
                                    </button>
                                `}
                                <span class="text-[10px] text-slate-500">${(book.size ? (book.size / (1024*1024)).toFixed(1) : 0)} MB</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        }

        function updateStats() {
            document.getElementById('statTotalBooks').innerText = APP_STATE.books.length;
            document.getElementById('statOfflineCount').innerText = APP_STATE.offlineBookIds.size;
            
            let readingCount = 0;
            let finishedCount = 0;
            Object.values(APP_STATE.metadata.progress).forEach(p => {
                if (p.percentage >= 98) finishedCount++;
                else if (p.percentage > 0) readingCount++;
            });

            document.getElementById('statReading').innerText = readingCount;
            document.getElementById('statFinished').innerText = finishedCount;
        }

        function toggleFavorite(bookId) {
            const index = APP_STATE.metadata.favorites.indexOf(bookId);
            if (index > -1) APP_STATE.metadata.favorites.splice(index, 1);
            else APP_STATE.metadata.favorites.push(bookId);
            saveMetadataToLocal();
            renderBookshelf();
        }

        function getCategoryForBook(bookId) {
            for (const cat of APP_STATE.metadata.categories) {
                if (cat.bookIds && cat.bookIds.includes(bookId)) return cat.name;
            }
            return null;
        }

        function toggleOfflineFilter() {
            APP_STATE.onlyOfflineFilter = !APP_STATE.onlyOfflineFilter;
            const btn = document.getElementById('offlineFilterBtn');
            if (APP_STATE.onlyOfflineFilter) {
                btn.className = "px-3 py-1.5 rounded-xl text-xs font-medium border border-cyan-500 bg-cyan-500/20 text-cyan-300 transition flex items-center space-x-1.5 whitespace-nowrap shadow-sm";
            } else {
                btn.className = "px-3 py-1.5 rounded-xl text-xs font-medium border border-slate-700 bg-slate-800 text-slate-300 hover:border-cyan-500/50 transition flex items-center space-x-1.5 whitespace-nowrap";
            }
            renderBookshelf();
        }

        /**
         * 4. 離線下載與資料清理處理
         */
        async function handleDownloadOfflineBook(bookId) {
            const book = APP_STATE.books.find(b => b.id === bookId);
            if (!book) return;

            try {
                alert(`開始下載 《${book.name}》 到本機離線庫...`);
                let arrayBuffer = null;

                if (book.isLocalFile && book.rawFile) {
                    arrayBuffer = await book.rawFile.arrayBuffer();
                } else {
                    if (!APP_STATE.accessToken) {
                        await requestGoogleToken();
                    }
                    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${book.id}?alt=media`, {
                        headers: { Authorization: `Bearer ${APP_STATE.accessToken}` }
                    });
                    if (!res.ok) throw new Error('雲端檔案下載失敗');
                    arrayBuffer = await res.arrayBuffer();
                }

                await saveBookToOfflineDB(book.id, book.name, book.mimeType || 'application/octet-stream', arrayBuffer);
                await refreshOfflineBookIds();
                renderBookshelf();
                updateStats();
                alert(`《${book.name}》 離線下載完成！`);
            } catch (err) {
                alert('下載失敗：' + err.message);
            }
        }

        async function handleDeleteOfflineBook(bookId) {
            if (!confirm('確定要刪除這本書的本機離線快取嗎？')) return;
            await deleteBookFromOfflineDB(bookId);
            await refreshOfflineBookIds();
            renderBookshelf();
            updateStats();
        }

        async function handleClearAllOfflineData() {
            if (!confirm('確定要清空所有已下載的離線電子書嗎？此操作不可復原。')) return;
            const ids = Array.from(APP_STATE.offlineBookIds);
            for (const id of ids) {
                await deleteBookFromOfflineDB(id);
            }
            await refreshOfflineBookIds();
            renderBookshelf();
            updateStats();
            document.getElementById('storageUsageText').innerText = '0.0 MB';
            alert('離線快取已完全清空。');
        }

        /**
         * 5. 電子書開啟與閱讀器核心 (EPUB & PDF)
         */
        async function openBook(bookId) {
            const book = APP_STATE.books.find(b => b.id === bookId);
            if (!book) return;

            APP_STATE.currentBook = book;
            document.getElementById('readerOverlay').classList.remove('hidden');
            document.getElementById('readerLoading').classList.remove('hidden');
            document.getElementById('readerBookTitle').innerText = book.name;

            try {
                let arrayBuffer = null;
                // A. 優先檢查 IndexedDB 離線快取
                const cachedRecord = await getBookFromOfflineDB(bookId);
                if (cachedRecord) {
                    arrayBuffer = cachedRecord.data;
                } else if (book.isLocalFile && book.rawFile) {
                    arrayBuffer = await book.rawFile.arrayBuffer();
                } else {
                    // B. 線上向 Google Drive 請求
                    if (!navigator.onLine) {
                        throw new Error('目前處於離線狀態，且此書尚未下載至離線庫。');
                    }
                    if (!APP_STATE.accessToken) {
                        await requestGoogleToken();
                    }
                    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${book.id}?alt=media`, {
                        headers: { Authorization: `Bearer ${APP_STATE.accessToken}` }
                    });
                    if (!res.ok) throw new Error('雲端檔案讀取失敗');
                    arrayBuffer = await res.arrayBuffer();

                    // 自動快取設定開啟時儲存
                    if (APP_STATE.autoCache) {
                        saveBookToOfflineDB(book.id, book.name, book.mimeType || '', arrayBuffer).then(() => {
                            refreshOfflineBookIds().then(() => { renderBookshelf(); updateStats(); });
                        });
                    }
                }

                // C. 依副檔名選擇渲染器
                if (book.name.toLowerCase().endsWith('.epub')) {
                    initEpubViewer(arrayBuffer, bookId);
                } else if (book.name.toLowerCase().endsWith('.pdf')) {
                    initPdfViewer(arrayBuffer, bookId);
                } else {
                    throw new Error('不支援的電子書格式');
                }

            } catch (err) {
                alert('無法開啟書籍：' + err.message);
                closeReader();
            }
        }

        // --- EPUB 渲染邏輯 (徹底修正排版錯亂與黑底黑字) ---
        function initEpubViewer(arrayBuffer, bookId) {
            document.getElementById('pdfControls').classList.add('hidden');
            document.getElementById('pdfControls').classList.remove('flex');
            document.getElementById('epubControls').classList.remove('hidden');
            document.getElementById('epubControls').classList.add('flex');

            document.getElementById('pdfViewerContainer').classList.add('hidden');
            const container = document.getElementById('epubViewerContainer');
            container.classList.remove('hidden');
            container.innerHTML = '';

            APP_STATE.epubBook = ePub(arrayBuffer);
            
            // 使用 scrolled-doc 捲動模式，禁止強制雙頁
            APP_STATE.epubRendition = APP_STATE.epubBook.renderTo("epubViewerContainer", {
                width: "100%",
                height: "100%",
                flow: "scrolled-doc",
                spread: "none",
                allowScriptedContent: true
            });

            // 註冊主題（解決黑底黑字問題）
            APP_STATE.epubRendition.themes.register("light", {
                "html, body": { "background": "#ffffff !important", "color": "#1f2937 !important" },
                "body *": { "color": "#1f2937 !important", "background-color": "transparent !important" }
            });
            APP_STATE.epubRendition.themes.register("dark", {
                "html, body": { "background": "#1a1a1a !important", "color": "#e5e7eb !important" },
                "body *": { "color": "#e5e7eb !important", "background-color": "transparent !important" },
                "a, a *": { "color": "#60a5fa !important" }
            });
            APP_STATE.epubRendition.themes.register("sepia", {
                "html, body": { "background": "#fbf0d9 !important", "color": "#5f4b32 !important" },
                "body *": { "color": "#5f4b32 !important", "background-color": "transparent !important" }
            });

            // 強制設定 CSS
            APP_STATE.epubRendition.themes.default({
                "html, body": {
                    "writing-mode": "horizontal-tb !important",
                    "-webkit-writing-mode": "horizontal-tb !important",
                    "padding": "16px 24px !important",
                    "line-height": "1.8 !important",
                    "max-width": "850px !important",
                    "margin": "0 auto !important"
                },
                "img, svg": {
                    "max-width": "100% !important",
                    "height": "auto !important"
                }
            });

            const savedProg = APP_STATE.metadata.progress[bookId];
            const startCfi = savedProg ? savedProg.cfi : undefined;

            APP_STATE.epubRendition.display(startCfi).then(() => {
                document.getElementById('readerLoading').classList.add('hidden');
            });

            // 進度追蹤與紀錄
            APP_STATE.epubRendition.on("relocated", (location) => {
                if (!location || !location.end) return;
                const percentage = Math.round(location.end.percentage * 100);
                document.getElementById('readingProgressBar').style.width = percentage + '%';
                document.getElementById('readingProgressText').innerText = `進度: ${percentage}%`;

                APP_STATE.metadata.progress[bookId] = {
                    cfi: location.end.cfi,
                    percentage: percentage,
                    lastRead: Date.now()
                };
                saveMetadataToLocal();
            });

            // 讀取章節目錄
            APP_STATE.epubBook.loaded.navigation.then((toc) => {
                const list = document.getElementById('tocList');
                list.innerHTML = '';
                toc.forEach((chapter) => {
                    const li = document.createElement('li');
                    li.className = "cursor-pointer hover:text-indigo-400 py-1 border-b border-slate-800/60 truncate";
                    li.innerText = chapter.label.trim();
                    li.onclick = () => {
                        APP_STATE.epubRendition.display(chapter.href);
                        toggleTocDrawer();
                    };
                    list.appendChild(li);
                });
            });
        }

        function cycleEpubTheme() {
            const themes = ['light', 'sepia', 'dark'];
            const nextIdx = (themes.indexOf(APP_STATE.epubTheme) + 1) % themes.length;
            APP_STATE.epubTheme = themes[nextIdx];
            if (APP_STATE.epubRendition) {
                APP_STATE.epubRendition.themes.select(APP_STATE.epubTheme);
            }
        }

        function changeEpubFontSize(delta) {
            APP_STATE.epubFontSize = Math.max(70, Math.min(200, APP_STATE.epubFontSize + delta));
            if (APP_STATE.epubRendition) {
                APP_STATE.epubRendition.themes.fontSize(`${APP_STATE.epubFontSize}%`);
            }
        }

        function toggleTocDrawer() {
            const drawer = document.getElementById('tocDrawer');
            drawer.classList.toggle('-translate-x-full');
        }

        // --- PDF 渲染邏輯 ---
        async function initPdfViewer(arrayBuffer, bookId) {
            document.getElementById('epubControls').classList.add('hidden');
            document.getElementById('epubControls').classList.remove('flex');
            document.getElementById('pdfControls').classList.remove('hidden');
            document.getElementById('pdfControls').classList.add('flex');

            document.getElementById('epubViewerContainer').classList.add('hidden');
            document.getElementById('pdfViewerContainer').classList.remove('hidden');

            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            APP_STATE.pdfDoc = await loadingTask.promise;

            document.getElementById('pdfPageCount').innerText = APP_STATE.pdfDoc.numPages;
            
            const savedProg = APP_STATE.metadata.progress[bookId];
            APP_STATE.pdfPageNum = savedProg ? (savedProg.page || 1) : 1;
            
            renderPdfPage(APP_STATE.pdfPageNum);
            document.getElementById('readerLoading').classList.add('hidden');
        }

        async function renderPdfPage(num) {
            if (!APP_STATE.pdfDoc) return;
            const page = await APP_STATE.pdfDoc.getPage(num);
            const canvas = document.getElementById('pdfCanvas');
            const ctx = canvas.getContext('2d');

            const viewport = page.getViewport({ scale: APP_STATE.pdfScale });
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            await page.render({ canvasContext: ctx, viewport: viewport }).promise;

            document.getElementById('pdfPageNum').value = num;
            const percentage = Math.round((num / APP_STATE.pdfDoc.numPages) * 100);
            document.getElementById('readingProgressBar').style.width = percentage + '%';
            document.getElementById('readingProgressText').innerText = `頁數: ${num} / ${APP_STATE.pdfDoc.numPages} (${percentage}%)`;

            // 記錄進度
            if (APP_STATE.currentBook) {
                APP_STATE.metadata.progress[APP_STATE.currentBook.id] = {
                    page: num,
                    percentage: percentage,
                    lastRead: Date.now()
                };
                saveMetadataToLocal();
            }
        }

        function changePdfPage(delta) {
            if (!APP_STATE.pdfDoc) return;
            const newNum = APP_STATE.pdfPageNum + delta;
            if (newNum >= 1 && newNum <= APP_STATE.pdfDoc.numPages) {
                APP_STATE.pdfPageNum = newNum;
                renderPdfPage(newNum);
            }
        }

        function jumpToPdfPage(val) {
            const num = parseInt(val);
            if (num >= 1 && num <= APP_STATE.pdfDoc.numPages) {
                APP_STATE.pdfPageNum = num;
                renderPdfPage(num);
            }
        }

        function zoomPdf(delta) {
            APP_STATE.pdfScale = Math.max(0.6, Math.min(3.0, APP_STATE.pdfScale + delta));
            renderPdfPage(APP_STATE.pdfPageNum);
        }

        function closeReader() {
            document.getElementById('readerOverlay').classList.add('hidden');
            if (APP_STATE.epubRendition) {
                try { APP_STATE.epubRendition.destroy(); } catch(e){}
                APP_STATE.epubRendition = null;
            }
            APP_STATE.pdfDoc = null;
            APP_STATE.currentBook = null;
            renderBookshelf();
            updateStats();
        }

        /**
         * 6. 本機檔案開啟處理
         */
        function handleLocalFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            const fakeId = 'local_' + Date.now();
            const newBook = {
                id: fakeId,
                name: file.name,
                mimeType: file.type,
                size: file.size,
                isLocalFile: true,
                rawFile: file
            };

            APP_STATE.books.unshift(newBook);
            saveBooksToLocal();
            renderBookshelf();
            updateStats();
            openBook(fakeId);
        }

        /**
         * 7. Google Drive API 雲端同步與授權
         */
        function parseFolderId(input) {
            if (!input) return '';
            const match = input.match(/folders\/([a-zA-Z0-9_-]+)/);
            return match ? match[1] : input.trim();
        }

        function requestGoogleToken() {
            return new Promise((resolve, reject) => {
                if (!APP_STATE.clientId) {
                    alert('請先在設定中填入您的 Google OAuth Client ID');
                    openSettingsModal();
                    reject(new Error('未設定 Client ID'));
                    return;
                }

                const client = google.accounts.oauth2.initTokenClient({
                    client_id: APP_STATE.clientId,
                    scope: 'https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.file',
                    callback: (response) => {
                        if (response.error) reject(response);
                        else {
                            APP_STATE.accessToken = response.access_token;
                            resolve(response.access_token);
                        }
                    }
                });
                client.requestAccessToken();
            });
        }

        async function syncGoogleDrive() {
            const folderId = parseFolderId(APP_STATE.folderId);
            if (!folderId) {
                alert('請先點擊齒輪設定 Google 雲端資料夾網址或 ID');
                openSettingsModal();
                return;
            }

            const syncIcon = document.getElementById('syncIcon');
            syncIcon.classList.add('animate-spin');

            try {
                if (!APP_STATE.accessToken) {
                    await requestGoogleToken();
                }

                // 1. 掃描資料夾內的電子書
                const q = `'${folderId}' in parents and (mimeType='application/pdf' or mimeType='application/epub+zip' or name contains '.epub' or name contains '.pdf') and trashed=false`;
                const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name,mimeType,modifiedTime,size)`, {
                    headers: { Authorization: `Bearer ${APP_STATE.accessToken}` }
                });
                const data = await res.json();
                if (data.files) {
                    APP_STATE.books = data.files;
                    saveBooksToLocal();
                }

                // 2. 搜尋與寫回 bookshelf_metadata.json
                const metaQ = `'${folderId}' in parents and name='bookshelf_metadata.json' and trashed=false`;
                const metaRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(metaQ)}`, {
                    headers: { Authorization: `Bearer ${APP_STATE.accessToken}` }
                });
                const metaData = await metaRes.json();

                if (metaData.files && metaData.files.length > 0) {
                    // 合併雲端進度與本機離線進度
                    const cloudFileId = metaData.files[0].id;
                    const contentRes = await fetch(`https://www.googleapis.com/drive/v3/files/${cloudFileId}?alt=media`, {
                        headers: { Authorization: `Bearer ${APP_STATE.accessToken}` }
                    });
                    const cloudMeta = await contentRes.json();
                    
                    // 時間戳記比對智慧合併
                    Object.keys(cloudMeta.progress || {}).forEach(bId => {
                        const localP = APP_STATE.metadata.progress[bId];
                        const cloudP = cloudMeta.progress[bId];
                        if (!localP || (cloudP.lastRead > localP.lastRead)) {
                            APP_STATE.metadata.progress[bId] = cloudP;
                        }
                    });
                    saveMetadataToLocal();

                    // 上傳最新合併結果
                    await fetch(`https://www.googleapis.com/upload/drive/v3/files/${cloudFileId}?uploadType=media`, {
                        method: 'PATCH',
                        headers: {
                            Authorization: `Bearer ${APP_STATE.accessToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(APP_STATE.metadata)
                    });
                } else {
                    // 建立全新的 metadata 檔案
                    const fileMetadata = {
                        name: 'bookshelf_metadata.json',
                        parents: [folderId],
                        mimeType: 'application/json'
                    };
                    const form = new FormData();
                    form.append('metadata', new Blob([JSON.stringify(fileMetadata)], { type: 'application/json' }));
                    form.append('file', new Blob([JSON.stringify(APP_STATE.metadata)], { type: 'application/json' }));

                    await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                        method: 'POST',
                        headers: { Authorization: `Bearer ${APP_STATE.accessToken}` },
                        body: form
                    });
                }

                renderBookshelf();
                updateStats();
                alert('雲端同步成功！已更新藏書清單與進度。');
            } catch (err) {
                alert('同步失敗：' + err.message);
            } finally {
                syncIcon.classList.remove('animate-spin');
            }
        }

        /**
         * 8. 設定 Modal 與 分類邏輯
         */
        async function openSettingsModal() {
            document.getElementById('settingClientId').value = APP_STATE.clientId;
            document.getElementById('settingFolderId').value = APP_STATE.folderId;
            document.getElementById('settingAutoCache').checked = APP_STATE.autoCache;
            document.getElementById('settingsModal').classList.remove('hidden');

            const mb = await calculateOfflineStorageUsage();
            document.getElementById('storageUsageText').innerText = `${mb} MB`;
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings() {
            APP_STATE.clientId = document.getElementById('settingClientId').value.trim();
            APP_STATE.folderId = document.getElementById('settingFolderId').value.trim();
            APP_STATE.autoCache = document.getElementById('settingAutoCache').checked;

            localStorage.setItem('gdrive_client_id', APP_STATE.clientId);
            localStorage.setItem('gdrive_folder_id', APP_STATE.folderId);
            localStorage.setItem('setting_auto_cache', APP_STATE.autoCache);

            closeSettingsModal();
            alert('設定已儲存！');
        }

        function promptAddCategory() {
            const name = prompt('請輸入新分類名稱：');
            if (name) {
                APP_STATE.metadata.categories.push({ name: name, bookIds: [] });
                saveMetadataToLocal();
                updateCategoryDropdown();
            }
        }

        function updateCategoryDropdown() {
            const select = document.getElementById('categoryFilter');
            select.innerHTML = `
                <option value="ALL">全部分類</option>
                <option value="FAV">最愛珍藏 ❤️</option>
                <option value="UNCATEGORIZED">未分類</option>
            `;
            APP_STATE.metadata.categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.name;
                opt.innerText = cat.name;
                select.appendChild(opt);
            });
        }
        updateCategoryDropdown();
    </script>
</body>
</html>
