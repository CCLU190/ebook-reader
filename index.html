    <!-- MAIN APP SCRIPT -->
    <script>
        // =========================================================================
        // 1. INDEXEDDB DATABASE MANAGER (EbookOfflineDB)
        // =========================================================================
        class EbookDB {
            constructor() {
                this.dbName = 'EbookOfflineDB';
                this.version = 1;
                this.db = null;
            }

            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.version);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('books')) {
                            db.createObjectStore('books', { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        resolve();
                    };
                    request.onerror = (e) => reject(e.target.error);
                });
            }

            async saveBookFile(bookId, blob) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('books', 'readwrite');
                    const store = tx.objectStore('books');
                    store.put({ id: bookId, blob: blob, savedAt: Date.now() });
                    tx.oncomplete = () => resolve();
                    tx.onerror = (e) => reject(e.target.error);
                });
            }

            async getBookFile(bookId) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('books', 'readonly');
                    const store = tx.objectStore('books');
                    const req = store.get(bookId);
                    req.onsuccess = () => resolve(req.result ? req.result.blob : null);
                    req.onerror = (e) => reject(e.target.error);
                });
            }

            async removeBookFile(bookId) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('books', 'readwrite');
                    const store = tx.objectStore('books');
                    store.delete(bookId);
                    tx.oncomplete = () => resolve();
                    tx.onerror = (e) => reject(e.target.error);
                });
            }

            async clearAll() {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('books', 'readwrite');
                    const store = tx.objectStore('books');
                    store.clear();
                    tx.oncomplete = () => resolve();
                    tx.onerror = (e) => reject(e.target.error);
                });
            }
        }

        const dbManager = new EbookDB();

        // =========================================================================
        // 2. GLOBAL STATE & THEMES
        // =========================================================================
        const STATE = {
            books: [],             // Local metadata list of books
            currentBook: null,     // Currently reading book object
            currentTheme: 'light', // light | sepia | dark
            fontSize: 18,          // Default font size in px
            readerWidth: '1200',   // '900' | '1200' | '100%'
            googleAccessToken: null,
            isOffline: !navigator.onLine,
            
            // EPUB specific instance handles
            epubBook: null,
            epubRendition: null,
            
            // PDF specific instance handles
            pdfDoc: null,
            pdfScale: 1.2
        };

        const THEMES = {
            light: { bg: '#ffffff', text: '#1f2937', containerBg: '#ffffff' },
            sepia: { bg: '#fbf0d9', text: '#433422', containerBg: '#f7e7c4' },
            dark:  { bg: '#111827', text: '#f3f4f6', containerBg: '#1f2937' }
        };

        // Initialize App
        window.addEventListener('load', async () => {
            await dbManager.init();
            initPWA();
            loadSettings();
            loadBooksFromLocalStorage();
            setupEventListeners();
            updateOfflineStatus();
            renderBookshelf();
        });

        // =========================================================================
        // 3. PWA & OFFLINE DETECTION
        // =========================================================================
        function initPWA() {
            // Generate inline manifest blob
            const manifestData = {
                name: "雲端離線電子書閱讀器",
                short_name: "電子書",
                start_url: "./",
                display: "standalone",
                background_color: "#1f2937",
                theme_color: "#2563eb",
                icons: [{
                    src: "https://cdn-icons-png.flaticon.com/512/3389/3389081.png",
                    sizes: "512x512",
                    type: "image/png"
                }]
            };
            const stringManifest = JSON.stringify(manifestData);
            const blob = new Blob([stringManifest], {type: 'application/json'});
            document.getElementById('manifestLink').setAttribute('href', URL.createObjectURL(blob));

            // Register inline service worker
            if ('serviceWorker' in navigator) {
                const swCode = `
                    const CACHE_NAME = 'ebook-pwa-v2';
                    self.addEventListener('install', (e) => e.waitUntil(self.skipWaiting()));
                    self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(
                            fetch(e.request).catch(() => caches.match(e.request))
                        );
                    });
                `;
                const swBlob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
            }

            window.addEventListener('online', updateOfflineStatus);
            window.addEventListener('offline', updateOfflineStatus);
        }

        function updateOfflineStatus() {
            STATE.isOffline = !navigator.onLine;
            const badge = document.getElementById('offlineStatusBadge');
            if (STATE.isOffline) {
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // =========================================================================
        // 4. STORAGE & BOOKSHELF METADATA
        // =========================================================================
        function loadBooksFromLocalStorage() {
            try {
                const data = localStorage.getItem('ebook_reader_books');
                STATE.books = data ? JSON.parse(data) : [];
            } catch (e) {
                STATE.books = [];
            }
        }

        function saveBooksToLocalStorage() {
            localStorage.setItem('ebook_reader_books', JSON.stringify(STATE.books));
        }

        function loadSettings() {
            const cid = localStorage.getItem('gdrive_client_id') || '';
            const fid = localStorage.getItem('gdrive_folder_id') || '';
            document.getElementById('settingClientId').value = cid;
            document.getElementById('settingFolderId').value = fid;
        }

        // =========================================================================
        // 5. BOOKSHELF UI RENDER
        // =========================================================================
        function renderBookshelf() {

                const matchSearch = book.title.toLowerCase().includes(searchVal) || (book.author && book.author.toLowerCase().includes(searchVal));

                if (catVal === 'FAV') return book.isFavorite;
                if (catVal === 'OFFLINE') return book.isDownloaded;
                return true;

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');

                        ${book.cover ? 
                            `<img src="${book.cover}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">` : 
                            `<div class="flex flex-col items-center text-gray-400">
                                <i class="fa-solid ${fileTypeUpper === 'PDF' ? 'fa-file-pdf text-red-500' : 'fa-book text-blue-500'} text-4xl mb-1"></i>
                                <span class="text-xs font-bold">${fileTypeUpper}</span>
                             </div>`
                        }
                        <!-- File Type Badge -->
                        <span class="absolute top-2 left-2 px-2 py-0.5 text-[10px] font-bold rounded bg-black/60 text-white backdrop-blur-sm">
                            ${fileTypeUpper}
                        </span>
                        <!-- Offline Downloaded Badge -->
                        ${book.isDownloaded ? `
                            <span class="absolute top-2 right-2 px-2 py-0.5 text-[10px] font-bold rounded bg-emerald-600 text-white shadow" title="已離線儲存">
                                <i class="fa-solid fa-circle-check"></i> 離線

                        }
                    </div>

                    <!-- Book Information -->
                    <div class="p-3 flex-1 flex flex-col justify-between space-y-2">
                        <div>
                            <h3 class="font-bold text-sm text-gray-800 dark:text-gray-100 line-clamp-2 cursor-pointer btn-open-book" data-id="${book.id}">${book.title}</h3>
                            <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5 truncate">${book.author || '未知作者'}</p>

                        <!-- Progress Bar & Actions -->
                        <div class="space-y-2 pt-1 border-t border-gray-100 dark:border-gray-700">

                                <span>${Math.round(progress)}%</span>
                            </div>
                            <div class="w-full bg-gray-200 dark:bg-gray-700 h-1.5 rounded-full overflow-hidden">

                            </div>

                            <div class="flex items-center justify-between pt-1 text-xs">

                                    <i class="fa-${book.isFavorite ? 'solid text-amber-500' : 'regular'} fa-star"></i>
                                </button>
                                
                                <div class="flex items-center space-x-1">
                                    <button class="btn-toggle-offline p-1 text-gray-500 hover:text-blue-600 dark:hover:text-blue-400" data-id="${book.id}" title="${book.isDownloaded ? '刪除離線快取' : '下載至離線快取'}">

            grid.querySelectorAll('.btn-open-book').forEach(el => {

        // =========================================================================
        // 6. FILE IMPORT & HANDLERS (.epub / .pdf)
        // =========================================================================
        async function handleFileImport(files) {
            for (const file of files) {
                const ext = file.name.split('.').pop().toLowerCase();
                if (ext !== 'epub' && ext !== 'pdf') continue;

                const bookId = 'book_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                const isEpub = ext === 'epub';

                // Save binary blob to IndexedDB
                await dbManager.saveBookFile(bookId, file);

                const newBook = {
                    id: bookId,
                    title: file.name.replace(/\.(epub|pdf)$/i, ''),
                    author: '未知作者',
                    format: ext,
                    size: file.size,
                    progress: 0,
                    cfi: null,
                    page: 1,
                    isFavorite: false,
                    isDownloaded: true,
                    cover: null,
                    updatedAt: Date.now()
                };

                // Quick metadata parse for EPUB
                if (isEpub) {
                    try {
                        const buffer = await file.arrayBuffer();
                        const book = ePub(buffer);
                        const meta = await book.loaded.metadata;
                        if (meta.title) newBook.title = meta.title;
                        if (meta.creator) newBook.author = meta.creator;

                        // Try loading cover URL
                        const coverUrl = await book.coverUrl();
                        if (coverUrl) {
                            const blob = await fetch(coverUrl).then(r => r.blob());
                            const reader = new FileReader();
                            reader.onloadend = () => {
                                newBook.cover = reader.result;
                                saveBooksToLocalStorage();
                                renderBookshelf();
                            };
                            reader.readAsDataURL(blob);
                        }
                    } catch (err) {
                        console.warn('Metadata parsing error:', err);
                    }
                }

                STATE.books.unshift(newBook);
            }

            saveBooksToLocalStorage();
            renderBookshelf();
        }

        // =========================================================================
        // 7. READER ENGINE (EPUB & PDF)
        // =========================================================================
        async function openBook(bookId) {
            const book = STATE.books.find(b => b.id === bookId);
            if (!book) return;

            STATE.currentBook = book;
            
            // Switch views
            document.getElementById('bookshelfView').classList.add('hidden');
            document.getElementById('readerView').classList.remove('hidden');
            document.getElementById('btnLibraryBack').classList.remove('hidden');
            document.getElementById('readerBookTitle').textContent = book.title;
            document.getElementById('readerSubTitle').textContent = '載入中...';

            // Get binary blob from IndexedDB
            let blob = await dbManager.getBookFile(bookId);
            if (!blob) {
                alert('無法尋找該書籍的本地離線檔案。若為雲端書籍，請先連結雲端同步。');
                closeReaderView();
                return;
            }

            const isPdf = (book.format || '').toLowerCase() === 'pdf';

            // Setup Toolbar visibility
            if (isPdf) {
                document.getElementById('epubFontControls').classList.add('hidden');
                document.getElementById('pdfZoomControls').classList.remove('hidden');
                document.getElementById('epubViewerContainer').classList.add('hidden');
                document.getElementById('pdfViewerContainer').classList.remove('hidden');
                await loadPdfReader(blob);
            } else {
                document.getElementById('epubFontControls').classList.remove('hidden');
                document.getElementById('pdfZoomControls').classList.add('hidden');
                document.getElementById('epubViewerContainer').classList.remove('hidden');
                document.getElementById('pdfViewerContainer').classList.add('hidden');
                await loadEpubReader(blob);
            }

            applyTheme(STATE.currentTheme);
            applyReaderWidth(STATE.readerWidth);
        }

        // -------------------------------------------------------------------------
        // EPUB READER ENGINE (scrolled-doc + injected styling + image zoom hook)
        // -------------------------------------------------------------------------
        async function loadEpubReader(blob) {
            const container = document.getElementById('epubViewerContainer');
            container.innerHTML = '';

            try {
                const buffer = await blob.arrayBuffer();
                if (STATE.epubBook) {
                    try { STATE.epubBook.destroy(); } catch (e) {}
                }

                STATE.epubBook = ePub(buffer);
                
                // CRITICAL FIX: flow: "scrolled-doc", spread: "none" for continuous smooth vertical scrolling
                STATE.epubRendition = STATE.epubBook.renderTo("epubViewerContainer", {
                    flow: "scrolled-doc",
                    spread: "none",
                    width: "100%",
                    height: "100%",
                    allowScriptedContent: true
                });

                // Display saved progress or start
                if (STATE.currentBook.cfi) {
                    await STATE.epubRendition.display(STATE.currentBook.cfi);
                } else {
                    await STATE.epubRendition.display();
                }

                // Register style & click-to-zoom image hooks
                STATE.epubRendition.hooks.content.register((contents) => {
                    const doc = contents.document;
                    if (!doc) return;

                    // Inject custom typography & fix image scaling
                    const style = doc.createElement('style');
                    const theme = THEMES[STATE.currentTheme];
                    style.innerHTML = `
                        html, body {
                            margin: 0 !important;
                            padding: 16px !important;
                            background-color: transparent !important;
                            color: ${theme.text} !important;
                            font-family: system-ui, -apple-system, sans-serif !important;
                            font-size: ${STATE.fontSize}px !important;
                            line-height: 1.75 !important;
                            word-wrap: break-word !important;
                        }
                        body * {
                            color: ${theme.text} !important;
                            background-color: transparent !important;
                        }
                        /* CRITICAL FIX: Full scale image display without small box constraints */
                        img, svg image, image {
                            max-width: 100% !important;
                            height: auto !important;
                            display: block !important;
                            margin: 16px auto !important;
                            cursor: zoom-in !important;
                            border-radius: 8px;
                            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
                        }
                    `;
                    doc.head.appendChild(style);

                    // Click-to-Zoom Image Lightbox binding
                    const imgs = doc.querySelectorAll('img, image');
                    imgs.forEach(img => {
                        img.addEventListener('click', (e) => {
                            e.preventDefault();
                            const src = img.src || img.getAttribute('xlink:href');
                            if (src) openImageLightbox(src);
                        });
                    });
                });

                // Relocated / Location progress tracking
                STATE.epubBook.ready.then(() => {
                    return STATE.epubBook.locations.generate(1024);
                }).then(() => {
                    updateEpubProgress();
                });

                STATE.epubRendition.on('relocated', (location) => {
                    if (location && location.start) {
                        STATE.currentBook.cfi = location.start.cfi;
                        updateEpubProgress();
                    }
                });

                // Load Table of Contents
                const toc = await STATE.epubBook.loaded.navigation;
                renderToc(toc.toc);

            } catch (err) {
                console.error('EPUB Loading error:', err);
                alert('載入 EPUB 檔案時發生錯誤：' + err.message);
            }
        }

        function updateEpubProgress() {
            if (!STATE.epubRendition || !STATE.epubBook || !STATE.epubBook.locations) return;
            const currentLocation = STATE.epubRendition.currentLocation();
            if (currentLocation && currentLocation.start) {
                const cfi = currentLocation.start.cfi;
                const progress = STATE.epubBook.locations.percentageFromCfi(cfi) || 0;
                const pct = Math.round(progress * 100);
                
                STATE.currentBook.progress = pct;
                document.getElementById('progressSlider').value = pct;
                document.getElementById('progressText').textContent = pct + '%';
                
                // Chapter Title
                if (currentLocation.start.href) {
                    document.getElementById('readerSubTitle').textContent = `進度: ${pct}%`;
                }

                saveBooksToLocalStorage();
            }
        }

        // -------------------------------------------------------------------------
        // PDF READER ENGINE (Continuous Vertical Scroll View)
        // -------------------------------------------------------------------------
        async function loadPdfReader(blob) {
            const container = document.getElementById('pdfViewerContainer');
            container.innerHTML = '';

            try {
                const arrayBuffer = await blob.arrayBuffer();
                STATE.pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                
                document.getElementById('readerSubTitle').textContent = `共 ${STATE.pdfDoc.numPages} 頁`;
                
                // Render Page 1 initially or saved page
                renderPdfPages();
                
                // TOC mock for PDF
                const tocList = document.getElementById('tocList');
                tocList.innerHTML = '';
                for (let i = 1; i <= STATE.pdfDoc.numPages; i++) {
                    const item = document.createElement('button');
                    item.className = "w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 truncate font-medium";
                    item.textContent = `第 ${i} 頁`;
                    item.onclick = () => {
                        const pageEl = document.getElementById(`pdf-page-${i}`);
                        if (pageEl) pageEl.scrollIntoView({ behavior: 'smooth' });
                        closeToc();
                    };
                    tocList.appendChild(item);
                }

            } catch (err) {
                console.error('PDF Load Error:', err);
                alert('無法載入 PDF 檔案：' + err.message);
            }
        }

        async function renderPdfPages() {
            const container = document.getElementById('pdfViewerContainer');
            container.innerHTML = '';

            for (let i = 1; i <= STATE.pdfDoc.numPages; i++) {
                const page = await STATE.pdfDoc.getPage(i);
                const viewport = page.getViewport({ scale: STATE.pdfScale });

                const pageWrapper = document.createElement('div');
                pageWrapper.id = `pdf-page-${i}`;
                pageWrapper.className = "relative shadow-lg rounded-md overflow-hidden bg-white mb-4";
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                pageWrapper.appendChild(canvas);
                container.appendChild(pageWrapper);

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                page.render(renderContext);

                // Click canvas to open Lightbox
                canvas.addEventListener('click', () => {
                    openImageLightbox(canvas.toDataURL());
                });
            }
        }

        // =========================================================================
        // 8. TABLE OF CONTENTS (TOC) DRAWER
        // =========================================================================
        function renderToc(tocItems) {
            const tocList = document.getElementById('tocList');
            tocList.innerHTML = '';

            if (!tocItems || tocItems.length === 0) {
                tocList.innerHTML = `<p class="text-gray-400 text-xs p-3">此電子書無內建章節目錄</p>`;
                return;
            }

            const buildTree = (items, depth = 0) => {
                items.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = `w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 truncate font-medium text-xs md:text-sm pl-${Math.min(depth * 4 + 3, 12)}`;
                    btn.textContent = item.label ? item.label.trim() : '未命名章節';
                    btn.onclick = () => {
                        if (STATE.epubRendition && item.href) {
                            STATE.epubRendition.display(item.href);
                            closeToc();
                        }
                    };
                    tocList.appendChild(btn);

                    if (item.subitems && item.subitems.length > 0) {
                        buildTree(item.subitems, depth + 1);
                    }
                });
            };

            buildTree(tocItems);
        }

        function openToc() {
            document.getElementById('tocSidebar').classList.remove('-translate-x-full');
            document.getElementById('tocOverlay').classList.remove('hidden');
        }

        function closeToc() {
            document.getElementById('tocSidebar').classList.add('-translate-x-full');
            document.getElementById('tocOverlay').classList.add('hidden');
        }

        // =========================================================================
        // 9. THEME & READING WIDTH CONTROLS
        // =========================================================================
        function applyTheme(themeKey) {
            STATE.currentTheme = themeKey;
            const theme = THEMES[themeKey];
            const wrapper = document.getElementById('readerWidthWrapper');

            if (themeKey === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }

            wrapper.style.backgroundColor = theme.containerBg;

            // Re-register iframe EPUB styling if active
            if (STATE.epubRendition && STATE.epubRendition.getContents()) {
                const contents = STATE.epubRendition.getContents();
                contents.forEach(c => {
                    const doc = c.document;
                    if (doc) {
                        doc.body.style.setProperty('color', theme.text, 'important');
                    }
                });
            }
        }

        function applyReaderWidth(widthVal) {
            STATE.readerWidth = widthVal;
            const wrapper = document.getElementById('readerWidthWrapper');
            
            if (widthVal === '100%') {
                wrapper.style.maxWidth = '100%';
            } else {
                wrapper.style.maxWidth = widthVal + 'px';
            }

            // Update button states
            document.querySelectorAll('.btnWidthOpt').forEach(btn => {
                if (btn.getAttribute('data-width') === widthVal) {
                    btn.classList.add('bg-white', 'dark:bg-gray-600', 'shadow-sm', 'text-blue-600', 'dark:text-blue-300');
                } else {
                    btn.classList.remove('bg-white', 'dark:bg-gray-600', 'shadow-sm', 'text-blue-600', 'dark:text-blue-300');
                }
            });
        }

        // =========================================================================
        // 10. CLICK-TO-ZOOM IMAGE LIGHTBOX OVERLAY
        // =========================================================================
        let lbScale = 1;
        let lbTranslateX = 0;
        let lbTranslateY = 0;
        let isDraggingLb = false;
        let lbStartX = 0, lbStartY = 0;

        function openImageLightbox(imageSrc) {
            const lightbox = document.getElementById('imageLightbox');
            const img = document.getElementById('lightboxImage');
            
            img.src = imageSrc;
            lbScale = 1;
            lbTranslateX = 0;
            lbTranslateY = 0;
            updateLightboxTransform();

            lightbox.classList.remove('hidden');
        }

        function closeImageLightbox() {
            document.getElementById('imageLightbox').classList.add('hidden');
        }

        function updateLightboxTransform() {
            const img = document.getElementById('lightboxImage');
            img.style.transform = `translate(${lbTranslateX}px, ${lbTranslateY}px) scale(${lbScale})`;
            document.getElementById('lightboxInfo').textContent = `縮放比例: ${Math.round(lbScale * 100)}%`;
        }

        // Lightbox Interactivity setup
        const viewport = document.getElementById('lightboxViewport');
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY < 0) {
                lbScale = Math.min(lbScale * 1.15, 5);
            } else {
                lbScale = Math.max(lbScale / 1.15, 0.5);
            }
            updateLightboxTransform();
        });

        viewport.addEventListener('mousedown', (e) => {
            isDraggingLb = true;
            lbStartX = e.clientX - lbTranslateX;
            lbStartY = e.clientY - lbTranslateY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDraggingLb) return;
            lbTranslateX = e.clientX - lbStartX;
            lbTranslateY = e.clientY - lbStartY;
            updateLightboxTransform();
        });

        window.addEventListener('mouseup', () => { isDraggingLb = false; });

        document.getElementById('btnLbZoomIn').onclick = () => { lbScale = Math.min(lbScale * 1.25, 5); updateLightboxTransform(); };
        document.getElementById('btnLbZoomOut').onclick = () => { lbScale = Math.max(lbScale / 1.25, 0.5); updateLightboxTransform(); };
        document.getElementById('btnLbReset').onclick = () => { lbScale = 1; lbTranslateX = 0; lbTranslateY = 0; updateLightboxTransform(); };
        document.getElementById('btnCloseLightbox').onclick = closeImageLightbox;

        // =========================================================================
        // 11. GOOGLE DRIVE SYNC & BUG FIX (remoteBooks.forEach is not a function)
        // =========================================================================
        async function syncWithGoogleDrive() {
            const clientId = localStorage.getItem('gdrive_client_id');
            if (!clientId) {
                alert('請先在設定畫面中設定您的 Google OAuth Client ID！');
                document.getElementById('settingsModal').classList.remove('hidden');
                return;
            }

            const syncIcon = document.getElementById('syncIcon');
            const syncText = document.getElementById('syncText');

            syncIcon.className = "fa-solid fa-spinner fa-spin";
            syncText.textContent = "同步中...";

            try {
                // Request Access Token via GIS Token Client
                const tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: clientId,
                    scope: 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/drive',
                    callback: async (response) => {
                        if (response.error) {
                            alert('Google 認證失敗: ' + response.error);
                            resetSyncBtn();
                            return;
                        }
                        STATE.googleAccessToken = response.access_token;
                        await executeDriveSync();
                        resetSyncBtn();
                    }
                });
                tokenClient.requestAccessToken();
            } catch (err) {
                alert('Google 同步失敗：' + err.message);
                resetSyncBtn();
            }
        }

        function resetSyncBtn() {
            document.getElementById('syncIcon').className = "fa-solid fa-cloud-arrow-up";
            document.getElementById('syncText').textContent = "雲端同步";
        }

        async function executeDriveSync() {
            const token = STATE.googleAccessToken;
            const folderId = localStorage.getItem('gdrive_folder_id');

            // 1. Search metadata file `bookshelf_metadata.json`
            let query = "name = 'bookshelf_metadata.json' and trashed = false";
            if (folderId) query += ` and '${folderId}' in parents`;

            const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}`, {
                headers: { Authorization: `Bearer ${token}` }
            });
            const searchData = await searchRes.json();
            
            let remoteFileId = null;
            let remoteBooks = [];

            if (searchData.files && searchData.files.length > 0) {
                remoteFileId = searchData.files[0].id;
                // Fetch file content
                const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${remoteFileId}?alt=media`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                try {
                    remoteBooks = await fileRes.json();
                } catch(e) {
                    remoteBooks = [];
                }
            }

            // CRITICAL FIX: Safe conversion for both Array ([...]) and legacy Object ({...}) formats
            const remoteBookList = Array.isArray(remoteBooks) 
                ? remoteBooks 
                : Object.values(remoteBooks || {});

            // Merge local and remote books
            const mergedMap = new Map();
            STATE.books.forEach(b => mergedMap.set(b.id, b));

            remoteBookList.forEach(rb => {
                if (!rb || !rb.id) return;
                const local = mergedMap.get(rb.id);
                if (!local || (rb.updatedAt && rb.updatedAt > (local.updatedAt || 0))) {
                    mergedMap.set(rb.id, { ...rb, isDownloaded: !!local?.isDownloaded });
                }
            });

            STATE.books = Array.from(mergedMap.values());
            saveBooksToLocalStorage();
            renderBookshelf();

            // Push updated metadata back to Google Drive
            const metadataContent = JSON.stringify(STATE.books, null, 2);
            const blob = new Blob([metadataContent], { type: 'application/json' });

            if (remoteFileId) {
                // Update file
                await fetch(`https://www.googleapis.com/upload/drive/v3/files/${remoteFileId}?uploadType=media`, {
                    method: 'PATCH',
                    headers: {
                        Authorization: `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: blob
                });
            } else {
                // Create file
                const metadata = {
                    name: 'bookshelf_metadata.json',
                    mimeType: 'application/json'
                };
                if (folderId) metadata.parents = [folderId];

                const form = new FormData();
                form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                form.append('file', blob);

                await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                    method: 'POST',
                    headers: { Authorization: `Bearer ${token}` },
                    body: form
                });
            }

            alert('雲端書籍資料同步完成！');
        }

        // =========================================================================
        // 12. EVENT LISTENERS SETUP
        // =========================================================================
        function setupEventListeners() {
            // File input & Drag-and-drop
            const fileInput = document.getElementById('fileInput');
            fileInput.addEventListener('change', (e) => handleFileImport(e.target.files));

            const dropZone = document.getElementById('dropZone');
            dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-blue-500'); });
            dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-blue-500'));
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('border-blue-500');
                if (e.dataTransfer.files) handleFileImport(e.dataTransfer.files);
            });

            // Search & Category Filters
            document.getElementById('searchInput').addEventListener('input', renderBookshelf);
            document.getElementById('categoryFilter').addEventListener('change', renderBookshelf);

            // Library Back Button
            document.getElementById('btnLibraryBack').addEventListener('click', closeReaderView);

            // TOC Drawer Toggle
            document.getElementById('btnToggleToc').addEventListener('click', openToc);
            document.getElementById('btnCloseToc').addEventListener('click', closeToc);
            document.getElementById('tocOverlay').addEventListener('click', closeToc);

            // Reading Width selector options
            document.querySelectorAll('.btnWidthOpt').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const width = e.target.getAttribute('data-width');
                    applyReaderWidth(width);
                });
            });

            // Theme Options
            document.querySelectorAll('.btnThemeOpt').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const theme = e.currentTarget.getAttribute('data-theme');
                    applyTheme(theme);
                });
            });

            // EPUB Font Size Controls
            document.getElementById('btnFontInc').onclick = () => {
                STATE.fontSize = Math.min(STATE.fontSize + 2, 36);
                document.getElementById('fontSizeDisplay').textContent = STATE.fontSize + 'px';
                if (STATE.currentBook) applyTheme(STATE.currentTheme);
            };
            document.getElementById('btnFontDec').onclick = () => {
                STATE.fontSize = Math.max(STATE.fontSize - 2, 12);
                document.getElementById('fontSizeDisplay').textContent = STATE.fontSize + 'px';
                if (STATE.currentBook) applyTheme(STATE.currentTheme);
            };

            // PDF Zoom Controls
            document.getElementById('btnPdfZoomIn').onclick = () => { STATE.pdfScale += 0.2; renderPdfPages(); };
            document.getElementById('btnPdfZoomOut').onclick = () => { STATE.pdfScale = Math.max(STATE.pdfScale - 0.2, 0.6); renderPdfPages(); };
            document.getElementById('btnPdfFitWidth').onclick = () => { STATE.pdfScale = 1.2; renderPdfPages(); };
            document.getElementById('btnPdfFitPage').onclick = () => { STATE.pdfScale = 0.9; renderPdfPages(); };

            // Page Navigation Buttons
            document.getElementById('btnPrevPage').onclick = () => {
                if (STATE.epubRendition) STATE.epubRendition.prev();
            };
            document.getElementById('btnNextPage').onclick = () => {
                if (STATE.epubRendition) STATE.epubRendition.next();
            };

            // Keyboard Shortcuts
            window.addEventListener('keydown', (e) => {
                if (document.getElementById('readerView').classList.contains('hidden')) return;
                if (e.key === 'ArrowLeft') {
                    if (STATE.epubRendition) STATE.epubRendition.prev();
                } else if (e.key === 'ArrowRight') {
                    if (STATE.epubRendition) STATE.epubRendition.next();
                } else if (e.key === 'Escape') {
                    closeImageLightbox();
                    closeToc();
                }
            });

            // Fullscreen Toggle
            document.getElementById('btnFullscreen').onclick = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            };

            // Settings Modal
            document.getElementById('btnOpenSettings').onclick = () => document.getElementById('settingsModal').classList.remove('hidden');
            document.getElementById('btnCloseSettings').onclick = () => document.getElementById('settingsModal').classList.add('hidden');
            document.getElementById('btnSaveSettings').onclick = () => {
                localStorage.setItem('gdrive_client_id', document.getElementById('settingClientId').value.trim());
                localStorage.setItem('gdrive_folder_id', document.getElementById('settingFolderId').value.trim());
                document.getElementById('settingsModal').classList.add('hidden');
                alert('設定已成功儲存！');
            };

            document.getElementById('btnClearStorage').onclick = async () => {
                if (confirm('確定要刪除所有本機快取與資料庫記錄嗎？')) {
                    await dbManager.clearAll();
                    localStorage.removeItem('ebook_reader_books');
                    STATE.books = [];
                    renderBookshelf();
                    document.getElementById('settingsModal').classList.add('hidden');
                }
            };

            // Drive Sync
            document.getElementById('btnDriveSync').onclick = syncWithGoogleDrive;
        }

        function closeReaderView() {
            document.getElementById('readerView').classList.add('hidden');
            document.getElementById('btnLibraryBack').classList.add('hidden');
            document.getElementById('bookshelfView').classList.remove('hidden');
            STATE.currentBook = null;
            renderBookshelf();
        }
    </script>
</body>
</html>
